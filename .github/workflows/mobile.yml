name: Mobile

on:
  push:
    tags:
      - "v*"

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - uses: shorebirdtech/setup-shorebird@v1

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Set up Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing ANDROID_GOOGLE_SERVICES_JSON secret"
            exit 1
          fi
          trimmed="${GOOGLE_SERVICES_JSON#"${GOOGLE_SERVICES_JSON%%[![:space:]]*}"}"
          case "$trimmed" in
            \{*)
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
              ;;
            *)
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
              ;;
          esac

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS secret"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > android/key.properties

      - name: Build release AAB with Shorebird
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::Missing SHOREBIRD_TOKEN secret"
            exit 1
          fi
          shorebird release android --artifact aab --flutter-version=3.50.1 --no-confirm

      - name: Derive signed universal APK from AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          curl -sSfL -o /tmp/bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar /tmp/bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=/tmp/hindsight.apks \
            --mode=universal \
            --ks=android/app/release.jks \
            --ks-pass=pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass=pass:"$KEYSTORE_PASSWORD"
          mkdir -p build/app/outputs/flutter-apk
          unzip -p /tmp/hindsight.apks universal.apk > build/app/outputs/flutter-apk/hindsight.apk

      - name: Check the APK is release-signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/hindsight.apk | tee /dev/stderr | grep -q "CN=Hindsight"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/hindsight.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/hindsight.apk \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Prepare AAB artifact
        run: cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/hindsight.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindsight-aab
          path: mobile/build/app/outputs/bundle/release/hindsight.aab
          retention-days: 30
