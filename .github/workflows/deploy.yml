name: Deploy

# Deploys the Worker (API + the web static export) whenever main changes.
# Needs repository secrets CLOUDFLARE_API_TOKEN (a token that can edit Workers and D1) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6

      - name: Test API
        working-directory: api
        run: uv sync && uv run pytest -q

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      # Files in api/migrations run once each; D1 records which ones have been applied.
      - name: Apply D1 migrations
        working-directory: api
        run: uv run pywrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        working-directory: api
        run: uv run pywrangler deploy
