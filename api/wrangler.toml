name = "chess-review"
main = "src/entry.py"
compatibility_date = "2026-10-01"
compatibility_flags = ["python_workers"]

# The Next static export (web/out, built with `npm run build`); only /api/* reaches the Python code.
[assets]
directory = "../web/out"
run_worker_first = ["/api/*"]

# Shared review cache. `pywrangler dev` uses a local SQLite copy; deploys use the real database.
[[d1_databases]]
binding = "DB"
database_name = "chess-review"
database_id = "e3165f9e-68d2-4930-8a07-62134d0c5644"

# Short-lived cache for Chess.com / Lichess game lists.
[[kv_namespaces]]
binding = "CACHE"
id = "29616266b5914ba6b52a582343358631"

# Coach comments. Workers AI always runs remotely, even under `pywrangler dev`, and is billed to the account.
[ai]
binding = "AI"
